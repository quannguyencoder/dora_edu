[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-edu"
version = "0.1.0"
description = "A Zero-Hallucination RAG chatbot for Vietnamese students based on official textbooks."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "DoraEdu Team", email = "hello@doraedu.com" }
]
dependencies = [
    "chromadb>=0.4.0",
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "sentence-transformers>=2.2.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.0"
]

[project.scripts]
dora-run-bot = "dora_edu.bot.telegram.app:main"
dora-run-zalo-bot = "dora_edu.bot.zalo.app:main"
dora-ingest = "dora_edu.data_pipeline.ingest:main"
dora-bulk-ingest = "dora_edu.data_pipeline.bulk_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
