[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-edu"
version = "0.1.0"
description = "A Zero-Hallucination RAG chatbot for Vietnamese students based on official textbooks."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "DoraEdu Team", email = "hello@doraedu.com" }
]
dependencies = [
    "chromadb>=0.4.0",
    "PyPDF2>=3.0.0",
    "sentence-transformers>=2.2.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.0"
]

[project.scripts]
dora-run-bot = "dora_edu.bot.telegram_app:main"
dora-ingest = "dora_edu.data_pipeline.pdf_parser:main"

[tool.setuptools.packages.find]
where = ["src"]
